name: 🛡️ Container Image Security Scan (Trivy)

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/Dockerfile'
      - 'backend/package.json'
      - 'backend/package-lock.json'
      - 'backend/scripts/security-audit.sh'
      - '.github/workflows/container-security-scan.yml'
  push:
    branches: [main]
    paths:
      - 'backend/Dockerfile'
      - '.github/workflows/container-security-scan.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy-container-scan:
    name: 🔍 Build & Scan Backend Docker Image
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: codepulse-backend:ci-${{ github.sha }}
      SARIF_REPORT: trivy-results.sarif

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v7

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 🏗️ Build Backend Container Image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          load: true
          tags: ${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 📄 Generate Trivy SARIF Vulnerability Report (OS & Libraries)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'image'
          image-ref: ${{ env.IMAGE_TAG }}
          format: 'sarif'
          output: ${{ env.SARIF_REPORT }}
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '0'

      - name: 📤 Upload SARIF Report to GitHub Security Tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: ${{ env.SARIF_REPORT }}
          category: 'trivy-backend-container'

      - name: 🚨 Enforce Critical CVE Gate (Vendor-Fix Available)
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          scan-type: 'image'
          image-ref: ${{ env.IMAGE_TAG }}
          format: 'table'
          vuln-type: 'os,library'
          severity: 'CRITICAL'
          ignore-unfixed: true
          exit-code: '1'
