apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: coderunners.execution.codepulse.io
  labels:
    app.kubernetes.io/name: codepulse
    app.kubernetes.io/part-of: execution-engine
spec:
  group: execution.codepulse.io
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - language
                - code
              properties:
                language:
                  type: string
                  enum:
                    - typescript
                    - javascript
                    - python
                    - go
                    - rust
                    - cpp
                    - java
                code:
                  type: string
                memoryLimit:
                  type: string
                  default: "256Mi"
                cpuLimit:
                  type: string
                  default: "500m"
                timeoutSeconds:
                  type: integer
                  minimum: 1
                  maximum: 300
                  default: 15
                poolWarmSize:
                  type: integer
                  minimum: 0
                  maximum: 50
                  default: 5
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum:
                    - Pending
                    - Provisioning
                    - Running
                    - Completed
                    - Failed
                podName:
                  type: string
                podIp:
                  type: string
                provisionDurationMs:
                  type: integer
                exitCode:
                  type: integer
                output:
                  type: string
                cleanupStatus:
                  type: string
  scope: Namespaced
  names:
    plural: coderunners
    singular: coderunner
    kind: CodeRunner
    shortNames:
      - cr
      - crun
